name: test-agent-society-empirical-mind

on:
  push:
    branches:
      - morocco26-agent-society-v2-front-vote-llm
    paths:
      - 'morocco26/agent_society_v4/empirical_*.py'
      - 'morocco26/agent_society_v4/tests/test_empirical_*.py'
      - 'morocco26/scripts/agent_society_empirical_mind_v9.py'
      - 'morocco26/frontends/agent_society_opus/source_v2/chatgpt_baseline/EMPIRICAL_*'
      - 'morocco26/data/goal100/agent_society_v2/EMPIRICAL_MOROCCAN_MIND_STATE_V1.json'
      - 'AGENTS_EMPIRICAL_MIND_ADDENDUM.md'
  workflow_dispatch:

jobs:
  empirical-mind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile V9 code
        run: |
          python -m py_compile \
            morocco26/agent_society_v4/empirical_priors_v9.py \
            morocco26/agent_society_v4/empirical_mind_v9.py \
            morocco26/agent_society_v4/empirical_validation_v9.py \
            morocco26/agent_society_v4/empirical_environment_v9.py \
            morocco26/scripts/agent_society_empirical_mind_v9.py \
            morocco26/frontends/agent_society_opus/source_v2/chatgpt_baseline/run_g0_sol_named_2026_empirical_v9.py
      - name: Validate JSON registries and blocked prior template
        run: |
          python morocco26/scripts/agent_society_empirical_mind_v9.py validate-registry \
            --dimensions morocco26/frontends/agent_society_opus/source_v2/chatgpt_baseline/EMPIRICAL_MIND_DIMENSIONS_V1.json \
            --sources morocco26/frontends/agent_society_opus/source_v2/chatgpt_baseline/EMPIRICAL_SOURCE_REGISTRY_V1.json \
            --snapshot-date 2026-08-23
          python morocco26/scripts/agent_society_empirical_mind_v9.py validate-prior-pack \
            --dimensions morocco26/frontends/agent_society_opus/source_v2/chatgpt_baseline/EMPIRICAL_MIND_DIMENSIONS_V1.json \
            --sources morocco26/frontends/agent_society_opus/source_v2/chatgpt_baseline/EMPIRICAL_SOURCE_REGISTRY_V1.json \
            --prior-pack morocco26/frontends/agent_society_opus/source_v2/chatgpt_baseline/EMPIRICAL_PRIOR_PACK_TEMPLATE_V1.json \
            --snapshot-date 2026-08-23 \
            --allow-blocked-template
      - name: Empirical mind tests
        run: python -m unittest discover -v -s morocco26/agent_society_v4/tests -p 'test_empirical_*.py'
