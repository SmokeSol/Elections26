name: morocco26-p3-remediation-gates

on:
  # No `paths` filter. A freeze gate whose coverage depends on what else is in
  # the push is not a gate. Commit 08d4b62 changed only this workflow and
  # FREEZE_MANIFEST_V9_1_P3_REMEDIATION.json, neither of which was listed: run
  # 32731849859 fired only because that push also carried d25b793, which touched
  # listed paths. Pushed alone - the normal case for a follow-up fix - it would
  # have been skipped. Every push to the branch is now covered.
  push:
    branches:
      - morocco26-agent-society-v2-front-vote-llm
  workflow_dispatch:

jobs:
  p3-remediation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile remediation code
        run: |
          python -m py_compile \
            morocco26/agent_society_v4/p3_data_layers_v1.py \
            morocco26/agent_society_v4/behavioral_mind_v8_1.py \
            morocco26/agent_society_v4/behavioral_environment_v8_1.py \
            morocco26/agent_society_v4/behavioral_realism_v8_1.py \
            morocco26/agent_society_v4/empirical_mind_v9_1.py \
            morocco26/agent_society_v4/empirical_validation_v9_1.py \
            morocco26/agent_society_v4/empirical_environment_v9_1.py \
            morocco26/agent_society_v4/rich_named_bridge_v1.py \
            morocco26/agent_society_v4/electoral_offer_2026_v1.py \
            morocco26/agent_society_v4/current_population_2026_v1.py \
            morocco26/scripts/p3_data_layer_certificate.py \
            morocco26/scripts/p3_rich_named_bridge.py \
            morocco26/scripts/p3_electoral_offer_2026.py \
            morocco26/scripts/p3_r3_local_pilot.py \
            morocco26/scripts/p3_verify_freeze.py \
            morocco26/scripts/agent_society_behavioral_v8_1.py \
            morocco26/scripts/agent_society_empirical_mind_v9_1.py \
            morocco26/scripts/agent_society_v2_build_current_population_2026.py

      - name: R0 - the stored data-layer certificate still verifies
        run: |
          python morocco26/scripts/p3_data_layer_certificate.py verify --fail-on-block

      - name: R1 - the V9.1 amendment applies to the frozen V9 registry
        run: |
          python morocco26/scripts/agent_society_empirical_mind_v9_1.py validate-amendment \
            --snapshot-date 2026-08-24

      - name: R1 - the frozen V9 payload files are untouched
        run: python morocco26/scripts/p3_verify_freeze.py --manifest v9

      - name: R1 - the V9.1 remediation freeze manifest still matches
        run: python morocco26/scripts/p3_verify_freeze.py --manifest v9_1

      - name: R2 - the shipped 2026 labour context refuses to build until sourced
        run: python morocco26/scripts/p3_verify_freeze.py --labour-template-must-fail

      - name: R4/R5 - the electoral-offer datasets validate while still empty
        run: |
          python morocco26/scripts/p3_electoral_offer_2026.py validate-programmes --snapshot-date 2026-08-24
          python morocco26/scripts/p3_electoral_offer_2026.py validate-regional --snapshot-date 2026-08-24

      - name: Remediation unit tests
        run: python -m unittest discover -v -s morocco26/agent_society_v4/tests -p 'test_p3_remediation*.py'

      - name: Behavioral and empirical regression tests
        run: python -m unittest discover -s morocco26/agent_society_v4/tests -p 'test_*.py'
