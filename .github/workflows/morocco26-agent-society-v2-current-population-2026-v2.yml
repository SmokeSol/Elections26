name: Morocco26 Agent Society V2 current-vintage 2026 population V2

# V2 binds every constituency_id to the administrative parent in the certified
# 2026 geometry instead of re-inferring it from the electoral constituency name.
# The HCP EMO2026 Q2 labour context is committed and source-audited in the repo.
#
# The named current-vintage input is committed too, so the build does not depend
# on an operator uploading an Actions artifact first: it reads the repo copy,
# checks its sha256 against NAMED_INPUT_2026_LINEAGE_V1.json, and refuses to
# build on any other bytes. `named_input_artifact_id` remains available as an
# override for a future snapshot that is not yet committed.
#
# Runs 32742167166 and 32742873701 both died on the source digests. The fetch
# step now proves each file separately - received bytes == Content-Length, then
# sha256 == the digest the historical builder records - so a truncated transfer
# is retried and never mistaken for upstream republishing the data. A preflight
# then resolves all 92 certified parents against the RGPH parent space and prints
# the whole table instead of dying on the first territory. Outputs upload even on
# failure, so the diagnosis survives the run.

on:
  workflow_dispatch:
    inputs:
      snapshot_date:
        description: 'Snapshot cutoff, ISO date'
        required: true
        default: '2026-08-24'
      named_input_artifact_id:
        description: 'Optional: Actions artifact id overriding the committed named input'
        required: false
        default: ''
      preflight_only:
        description: 'Set to true to stop after the parent-resolution preflight'
        required: false
        default: 'false'
  push:
    branches:
      - morocco26-agent-society-v2-front-vote-llm
    paths:
      - '.github/asv2-current-population-2026-trigger.txt'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    env:
      SNAPSHOT_DATE: ${{ github.event.inputs.snapshot_date || '2026-08-24' }}
      NAMED_INPUT_ARTIFACT_ID: ${{ github.event.inputs.named_input_artifact_id || '' }}
      PREFLIGHT_ONLY: ${{ github.event.inputs.preflight_only || 'false' }}
      COMMITTED_NAMED_INPUT: morocco26/data/goal100/agent_society_v2/named_input_current_vintage_2026-08-22.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install readers
        run: python -m pip install -q pyreadstat pandas numpy scikit-learn

      - name: Resolve the named current-vintage input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/pop2026/data /tmp/pop2026/in /tmp/pop2026/out
          if [ -n "$NAMED_INPUT_ARTIFACT_ID" ]; then
            echo "using the artifact override $NAMED_INPUT_ARTIFACT_ID"
            curl -fsSL -L -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              -o /tmp/pop2026/named_input.zip \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${NAMED_INPUT_ARTIFACT_ID}/zip"
            unzip -q -o /tmp/pop2026/named_input.zip -d /tmp/pop2026/in
            find /tmp/pop2026/in -name '*.json' | head -1 > /tmp/pop2026/named_path.txt
          else
            echo "using the committed named input"
            echo "$COMMITTED_NAMED_INPUT" > /tmp/pop2026/named_path.txt
          fi
          test -s "$(cat /tmp/pop2026/named_path.txt)"

      - name: Verify the named input against its published lineage
        run: |
          python morocco26/scripts/p3_verify_named_input.py \
            --named-input "$(cat /tmp/pop2026/named_path.txt)" \
            --allow-override "${NAMED_INPUT_ARTIFACT_ID:-}"

      - name: Fetch source microdata, completeness and digest checked per file
        run: |
          python morocco26/scripts/p3_fetch_microdata.py \
            --outdir /tmp/pop2026/data \
            --report /tmp/pop2026/out/source_microdata_fetch.json

      - name: Preflight - source digests and 92 certified parents
        run: |
          python morocco26/scripts/p3_population_2026_preflight.py \
            --ind /tmp/pop2026/data/rgph_individual.dta \
            --hh /tmp/pop2026/data/rgph_household.dta \
            --encdm /tmp/pop2026/data/encdm_household.sav \
            --labour-context morocco26/data/goal100/agent_society_v2/LABOUR_CONTEXT_2026_Q2_HCP.json \
            --output /tmp/pop2026/out/population_2026_preflight.json

      - name: Build geometry-bound current-vintage 2026 population
        if: env.PREFLIGHT_ONLY != 'true'
        run: |
          set -euo pipefail
          python morocco26/scripts/agent_society_v2_build_current_population_2026_geo_v2.py \
            --ind /tmp/pop2026/data/rgph_individual.dta \
            --hh /tmp/pop2026/data/rgph_household.dta \
            --encdm /tmp/pop2026/data/encdm_household.sav \
            --named-input "$(cat /tmp/pop2026/named_path.txt)" \
            --labour-context morocco26/data/goal100/agent_society_v2/LABOUR_CONTEXT_2026_Q2_HCP.json \
            --snapshot-date "$SNAPSHOT_DATE" \
            --outdir /tmp/pop2026/out

      - name: Assert politically empty population and certified geometry lineage
        if: env.PREFLIGHT_ONLY != 'true'
        run: |
          python morocco26/scripts/p3_verify_named_input.py \
            --population-certificate /tmp/pop2026/out/current_population_2026_certificate_v1.json

      # R2 runs here rather than in a job of its own because the population it
      # needs is an Actions artifact, and downloading one requires a signed-in
      # session. Measuring in the job that produced it keeps the result public:
      # the numbers land in a check-run annotation, which anyone can read.
      - name: R2 - bridge the real population and measure the V9.1 dimensions
        if: env.PREFLIGHT_ONLY != 'true'
        run: |
          python morocco26/scripts/p3_r2_measure.py \
            --named-input "$(cat /tmp/pop2026/named_path.txt)" \
            --rich-population /tmp/pop2026/out/2026_current_population_v1.json \
            --territory ain-chock \
            --voters-per-territory 32 \
            --snapshot-date "$SNAPSHOT_DATE" \
            --outdir /tmp/pop2026/r2

      - name: Upload whatever was produced, including on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asv2-current-population-2026-v2
          retention-days: 90
          if-no-files-found: warn
          path: |
            /tmp/pop2026/out/source_microdata_fetch.json
            /tmp/pop2026/out/population_2026_preflight.json
            /tmp/pop2026/out/2026_current_population_v1.json
            /tmp/pop2026/out/current_population_2026_certificate_v1.json
            /tmp/pop2026/r2/p3_r2_measurement.json
            /tmp/pop2026/r2/rich_named_bridge_certificate.json
            /tmp/pop2026/r2/p3_data_layer_certificate_rich.json
            /tmp/pop2026/r2/named_input_rich_2026.json
            morocco26/data/goal100/agent_society_v2/LABOUR_CONTEXT_2026_Q2_HCP.json
            morocco26/data/goal100/agent_society_v2/NAMED_INPUT_2026_LINEAGE_V1.json
            morocco26/data/goal100/geometry_2026_certificate.json
